<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators & Conditional Logic</title>
</head>
<body>
    
<h1>Operators & Conditional Logic</h1>

    <script>
        const num = 0;

        if(num > 0) {
            console.log(`Number ${num} is positive`);
        }
        else if(num < 0) {
            console.log(`Number ${num} is negative`);
        }
        else {
            console.log(`Number ${num} is zero`);

        }

    </script>
</body>
</html>
